<svg xmlns="http://www.w3.org/2000/svg" viewBox="169 187 916 916" role="img" aria-labelledby="title desc">
  <title id="title">Golden four-blade propeller</title>
  <desc id="desc">A polished gold marine propeller with four curved blades and a circular hub.</desc>
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset=".18" stop-color="#ffd95a"/>
      <stop offset=".48" stop-color="#d3930b"/>
      <stop offset=".72" stop-color="#ffda55"/>
      <stop offset="1" stop-color="#a96800"/>
    </linearGradient>
    <linearGradient id="bladeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f5700" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#df9e11" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff1a0" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="hub" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fff6ae"/>
      <stop offset=".28" stop-color="#ffd84f"/>
      <stop offset=".7" stop-color="#c47d00"/>
      <stop offset="1" stop-color="#7b4300"/>
    </radialGradient>
    <radialGradient id="cap" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff9c7"/>
      <stop offset=".35" stop-color="#ffd957"/>
      <stop offset="1" stop-color="#b66f00"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5b3400" flood-opacity=".35"/>
    </filter>
    <path id="bladePath" d="M665 574 C691 541 695 490 700 427 C710 304 765 214 858 197 C954 179 1040 247 1059 337 C1078 427 1026 500 949 523 C870 547 790 516 714 589 C695 607 670 598 665 574 Z"/>
    <clipPath id="bladeClip"><use href="#bladePath"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <g>
      <use href="#bladePath" fill="url(#blade)" stroke="#a96500" stroke-width="7" stroke-linejoin="round"/>
      <path d="M690 565 C735 482 763 375 850 314 C922 264 1003 291 1055 350 C1049 274 980 203 889 197 C793 191 724 274 705 396 C694 470 699 528 690 565 Z" fill="url(#bladeShade)" clip-path="url(#bladeClip)" opacity=".72"/>
      <path d="M720 535 C774 471 850 433 934 434 C979 435 1016 419 1050 386" fill="none" stroke="#fff4ab" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    </g>
    <g transform="rotate(90 627 627)">
      <use href="#bladePath" fill="url(#blade)" stroke="#a96500" stroke-width="7" stroke-linejoin="round"/>
      <path d="M690 565 C735 482 763 375 850 314 C922 264 1003 291 1055 350 C1049 274 980 203 889 197 C793 191 724 274 705 396 C694 470 699 528 690 565 Z" fill="url(#bladeShade)" opacity=".72"/>
      <path d="M720 535 C774 471 850 433 934 434 C979 435 1016 419 1050 386" fill="none" stroke="#fff4ab" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    </g>
    <g transform="rotate(180 627 627)">
      <use href="#bladePath" fill="url(#blade)" stroke="#a96500" stroke-width="7" stroke-linejoin="round"/>
      <path d="M690 565 C735 482 763 375 850 314 C922 264 1003 291 1055 350 C1049 274 980 203 889 197 C793 191 724 274 705 396 C694 470 699 528 690 565 Z" fill="url(#bladeShade)" opacity=".72"/>
      <path d="M720 535 C774 471 850 433 934 434 C979 435 1016 419 1050 386" fill="none" stroke="#fff4ab" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    </g>
    <g transform="rotate(270 627 627)">
      <use href="#bladePath" fill="url(#blade)" stroke="#a96500" stroke-width="7" stroke-linejoin="round"/>
      <path d="M690 565 C735 482 763 375 850 314 C922 264 1003 291 1055 350 C1049 274 980 203 889 197 C793 191 724 274 705 396 C694 470 699 528 690 565 Z" fill="url(#bladeShade)" opacity=".72"/>
      <path d="M720 535 C774 471 850 433 934 434 C979 435 1016 419 1050 386" fill="none" stroke="#fff4ab" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    </g>

    <circle cx="627" cy="627" r="105" fill="url(#hub)" stroke="#9a5b00" stroke-width="9"/>
    <circle cx="627" cy="627" r="73" fill="none" stroke="#f8c837" stroke-width="12" opacity=".9"/>
    <circle cx="627" cy="627" r="57" fill="url(#cap)" stroke="#925400" stroke-width="7"/>
    <ellipse cx="608" cy="604" rx="26" ry="18" fill="#fff9c3" opacity=".5"/>
  </g>
</svg>
