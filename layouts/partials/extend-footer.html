<p class="text-neutral-500 dark:text-neutral-400" style="margin-top: 0.75rem; font-size: 0.65rem; line-height: normal;">
  Opinions expressed are solely my own and do not express the views or opinions of my employer(s).
</p>

<script>
  (() => {
    const siteName = "tsmccallum.com";
    const suffix = ".com";

    document.querySelectorAll("header, main, footer").forEach((region) => {
      const walker = document.createTreeWalker(region, NodeFilter.SHOW_TEXT);
      const matches = [];

      while (walker.nextNode()) {
        const parentTag = walker.currentNode.parentElement?.tagName;
        if (
          parentTag !== "SCRIPT" &&
          parentTag !== "STYLE" &&
          walker.currentNode.nodeValue.includes(siteName)
        ) {
          matches.push(walker.currentNode);
        }
      }

      matches.forEach((textNode) => {
        const parts = textNode.nodeValue.split(siteName);
        const fragment = document.createDocumentFragment();

        parts.forEach((part, index) => {
          if (index > 0) {
            fragment.append("tsmccallum");
            const graySuffix = document.createElement("span");
            graySuffix.className = "text-neutral-400 dark:text-neutral-500";
            graySuffix.textContent = suffix;
            fragment.append(graySuffix);
          }
          fragment.append(part);
        });

        textNode.replaceWith(fragment);
      });
    });
  })();
</script>
