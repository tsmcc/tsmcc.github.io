{{- $skills := split (.Inner | strings.TrimSpace) "|" -}}
<div class="not-prose my-6 flex flex-wrap" style="column-gap: 1.25rem; row-gap: 0.75rem;" aria-label="Skills">
  {{- range $skills }}
    {{- $skill := strings.TrimSpace . -}}
    {{- with $skill }}
      <span class="rounded-full border border-primary-400 bg-primary-600 px-3 py-1 text-sm font-medium text-white">{{ . }}</span>
    {{- end }}
  {{- end }}
</div>
