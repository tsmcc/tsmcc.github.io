{{- $skills := split (.Inner | strings.TrimSpace) "|" -}}
<div class="not-prose my-6 flex flex-wrap gap-2" aria-label="Skills">
  {{- range $skills }}
    {{- $skill := strings.TrimSpace . -}}
    {{- with $skill }}
      <span class="rounded-full border border-primary-300 bg-primary-50 px-3 py-1 text-sm font-medium text-primary-700 dark:border-primary-600 dark:bg-primary-900/30 dark:text-primary-200">{{ . }}</span>
    {{- end }}
  {{- end }}
</div>
